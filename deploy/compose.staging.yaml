# Staging override. Run as its own project so containers, networks and
# volumes never touch production:
#   docker compose -p tt-staging -f deploy/compose.yaml -f deploy/compose.staging.yaml up -d --build
# Put staging values (its own TUNNEL_TOKEN, Stripe test keys) in deploy/.env.staging.
services:
  # Staging runs on seed data, so top it up after every migration. The seed
  # only creates rows that are missing, so it never undoes an edit.
  # (Production is seeded once, by hand, at cutover.)
  migrate:
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/prisma db seed
  app:
    env_file:
      - path: .env.staging
        required: false
  cloudflared:
    environment:
      TUNNEL_TOKEN: ${STAGING_TUNNEL_TOKEN:?Set STAGING_TUNNEL_TOKEN in deploy/.env}
  # Staging holds seed data only, so it gets no backups.
  backup:
    profiles: [never]

secrets:
  db_password:
    file: ./secrets/db_password.staging.txt
