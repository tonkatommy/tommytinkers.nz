name: CI

on:
  pull_request:
  push:
    # feature/new-site-v2.0 is where v2 phases merge (and what staging runs),
    # so it gets checked on every push too.
    branches: [main, feature/new-site-v2.0]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/tommytinkers.nz
    env:
      # Placeholders only, never real secrets. They mirror the build-time
      # placeholders in the Dockerfile. Nothing here connects to a database.
      #
      # prisma.config.ts resolves env("DATABASE_URL") eagerly, so both the
      # postinstall `prisma generate` and `next build` fail if it is unset.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      # Auth.js checks that a secret exists when auth.ts is loaded during
      # `next build`. The value is never used to sign anything in CI.
      AUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v7

      # No `version` input: the action reads "packageManager" from
      # package.json, which is the same pin corepack uses in the Dockerfile.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/tommytinkers.nz/package.json

      # Node major matches the Dockerfile base image (node:22-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/tommytinkers.nz/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # ---- v2 (site/tommytinkers.nz.v2.0) --------------------------------------
  v2:
    name: v2 lint, typecheck, build and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/tommytinkers.nz.v2.0
    # A throwaway Postgres, the same version as production. It only lives for
    # this job, so the credentials are placeholders.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Separate database that `migrate diff` is allowed to wipe.
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow
      # Better Auth won't load without these. Placeholders: CI has no real users.
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/tommytinkers.nz.v2.0/package.json

      # Node major matches the v2 Dockerfile base image (node:26-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/tommytinkers.nz.v2.0/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests (Vitest): helpers and rules, no browser or database.
      - run: pnpm test
      - run: pnpm build

      # Proves every migration applies cleanly to an empty database, the same
      # way the migrate container does on deploy.
      - name: Apply migrations to an empty database
        run: pnpm prisma migrate deploy

      # Database tests (Vitest): rules that live in the data layer, like the
      # sign-in lockout, against the real Postgres.
      - run: pnpm test:db

      # The browser tests expect the seeded catalogue. Running the seed
      # twice also proves it is safe to re-run.
      - name: Seed the catalogue
        run: pnpm db:seed && pnpm db:seed

      # End-to-end tests (Playwright): a real browser against the production
      # build, in both themes at 375px and 1280px, with axe accessibility checks.
      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/tommytinkers.nz.v2.0/playwright-report
          retention-days: 7

      # Fails if schema.prisma was changed without a matching migration.
      # --exit-code returns 2 when the two differ.
      - name: Check schema.prisma matches the migrations
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c 'CREATE DATABASE ci_shadow'
          pnpm prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

  # Builds the real images and runs the stack the way the server does, minus
  # the tunnel and backups, then asks the app if it can reach its database.
  v2-docker:
    name: v2 Docker smoke test
    runs-on: ubuntu-latest
    env:
      # compose.yaml refuses to load without it. cloudflared never starts here.
      TUNNEL_TOKEN: ci-placeholder-not-a-real-token
      COMPOSE: docker compose -p tt-ci -f deploy/compose.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Make a throwaway database password
        run: openssl rand -hex 32 > deploy/secrets/db_password.txt

      # The app reads its settings from deploy/.env, as it does on the server.
      - name: Make a throwaway app config
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
          } > deploy/.env

      # The backup image isn't started (it needs the age key), but building it
      # catches a broken Dockerfile before it reaches the server.
      - name: Build images
        run: $COMPOSE build migrate app backup

      - name: Start db, migrate and app
        run: $COMPOSE up -d --wait --wait-timeout 300 db migrate app

      - name: Check /api/health
        run: |
          body="$($COMPOSE exec -T app wget -qO- http://127.0.0.1:3000/api/health)"
          echo "$body"
          test "$body" = '{"status":"ok"}'

      # The sign-in page loads Better Auth and reads the session, so a 200
      # here proves accounts start up inside the real image.
      - name: Check the sign-in page
        run: $COMPOSE exec -T app wget -qO /dev/null http://127.0.0.1:3000/login

      - name: Show logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
