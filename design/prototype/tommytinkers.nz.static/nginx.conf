server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .jsx isn't in nginx's mime.types; Babel standalone fetches these and
    # transpiles them in the browser.
    location ~ \.jsx$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript;
}
