<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>SiteNotice - tommy tinkers NZ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tt.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&amp;family=Jura:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Agave Nerd";src:url("/_blob/2d014ce6e80b5f23dab3c6f0e576b40e") format("woff2");font-display:swap}
@font-face{font-family:"Phosphor";src:url("/_blob/2125ec5241b6e1f3e6201a3b42ce841e") format("woff2");font-display:block}
body{margin:0}
</style>
</helmet>
<div class="tt" data-theme="{{theme}}" style="font-family: var(--font-body); color: var(--text-primary);">
<div role="status" style="background: var(--bg-raised); border-bottom: 1px solid var(--border-default);">
  <div class="tt-container" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 12px;">
    <i class="ph ph-calendar-blank ph-20" aria-hidden="true" style="color: var(--eyebrow);"></i>
    <p style="font-size: 15px; flex: 1 1 320px;"><strong>{{title}}</strong> {{text}}</p>
    <a href="Policies.dc.html" style="font-size: 14px;">How dispatch works</a>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["later","paused"],"default":"later"},"$preview":{"width":1280,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    // Holiday mode, set in admin Settings. "later" keeps selling with a later dispatch date;
    // "paused" stops checkout but keeps the shop browsable. The message is Tommy's own.
    const paused = p.mode === 'paused';
    return {
      theme: p.theme || 'dark',
      title: paused ? 'Orders are paused until 24/11/2026.' : 'I\u2019m away until 24/11/2026.',
      text: paused ? 'I\u2019m on holiday, so checkout is closed. Have a look around, and the cart will keep what you add.' : 'You can still order. Anything you buy now gets printed and posted from 25/11/2026.'
    };
  }
}
</script>
</body>
</html>
