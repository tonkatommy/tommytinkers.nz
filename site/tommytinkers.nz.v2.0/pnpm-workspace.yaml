# pnpm only runs install scripts for packages listed here. Prisma needs its
# engines downloaded; everything else is blocked by default.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # tsx and Vitest use esbuild; its install script only checks the binary.
  esbuild: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - better-auth@1.7.22
